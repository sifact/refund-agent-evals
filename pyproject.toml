[project]
name = "refund-agent-evals"
version = "0.1.0"
description = "Production-grade refund support agent with layered DeepEval evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "psycopg[binary,pool]>=3.2",
    "typer",
]

[project.scripts]
refund-agent = "refund_agent.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "refund_agent"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: needs local Supabase (supabase start)"]
addopts = "-m 'not integration'"

[tool.ruff.format]
exclude = ["*.md"]
